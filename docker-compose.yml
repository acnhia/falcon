services:
  backend:
    build: ./backend
    environment:
      ACCOUNT_ID: ${account_id}
      ACCESS_ID: ${access_id}
      SECRET_KEY: ${secret_key}
      S3_URL: ${s3_url}
      BUCKET_NAME: ${BUCKET_NAME:-upload-demo}
      UPLOAD_WORKER_POOL_SIZE: ${UPLOAD_WORKER_POOL_SIZE:-8}
      ONBOARDING_CAPTURE_BASE_URL: ${ONBOARDING_CAPTURE_BASE_URL:-http://localhost:8080}
    expose:
      - "8081"

  frontend:
    build: ./react
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
